  <link href="https://fonts.googleapis.com/css2?family=LINE+Seed+JP:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #ffffff;
      --bg-soft: #f4f8f6;
      --border: rgba(15, 30, 22, 0.10);
      --border-strong: rgba(10, 157, 91, 0.40);
      --text: #0d1a13;
      --muted: #5b6b62;
      --muted-2: #8a958f;
      --green: #0a9d5b;
      --green-soft: rgba(10, 157, 91, 0.10);
      --green-glow: rgba(10, 157, 91, 0.20);
      --field: #f4f8f6;
      --danger: #e5484d;
      --shadow: 0 18px 50px rgba(15, 40, 28, 0.10);
      --radius-xl: 28px;
      --radius-lg: 22px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh;
      font-family: "LINE Seed JP", "Apple SD Gothic Neo", "Noto Sans KR", system-ui, sans-serif;
      background: radial-gradient(circle at 20% 0%, rgba(10,157,91,.08), transparent 32%),
                  radial-gradient(circle at 80% 10%, rgba(10,157,91,.05), transparent 28%),
                  linear-gradient(180deg,#fff 0%,#f4f8f6 100%);
      color: var(--text);
    }
    .app { display: grid; grid-template-columns: 290px 1fr; min-height: 100vh; }

    /* ── Sidebar ── */
    aside {
      border-right: 1px solid var(--border);
      background: rgba(255,255,255,.82);
      backdrop-filter: blur(18px);
      padding: 28px 20px;
      position: sticky; top: 0; height: 100vh;
      display: flex; flex-direction: column; gap: 0; overflow-y: auto;
    }
    .brand { display: flex; align-items: center; gap: 12px; margin-bottom: 34px; }
    .logo {
      width: 42px; height: 42px; border-radius: 14px;
      background: linear-gradient(135deg,#3ecf8e,#14784d);
      display: grid; place-items: center;
      color: #fff; font-weight: 800;
      box-shadow: 0 6px 20px var(--green-glow);
    }
    .brand h1 { font-size: 18px; margin: 0; letter-spacing: -0.02em; }
    .brand p  { margin: 3px 0 0; color: var(--muted); font-size: 12px; }

    .side-label {
      font-size: 11px; text-transform: uppercase; letter-spacing: .12em;
      color: var(--muted-2); margin: 24px 10px 10px;
    }
    .day-list { display: grid; gap: 8px; }
    .day-button {
      width: 100%; border: 1px solid transparent; background: transparent;
      color: var(--muted); padding: 13px 14px; border-radius: 14px;
      text-align: left; display: flex; justify-content: space-between; align-items: center;
      cursor: pointer; font: inherit; transition: .2s ease;
    }
    .day-button:hover { background: var(--green-soft); color: var(--text); }
    .day-button.active { background: var(--green-soft); color: var(--text); border-color: var(--border-strong); }
    .badge {
      font-size: 11px; color: var(--green);
      background: var(--green-soft); border: 1px solid var(--border-strong);
      padding: 3px 8px; border-radius: 999px; white-space: nowrap;
    }
    .badge.done { color: #fff; background: var(--green); border-color: var(--green); }
    .new-day {
      margin-top: 12px; width: 100%;
      border: 1px dashed var(--border-strong); background: var(--green-soft);
      color: var(--green); padding: 13px 14px; border-radius: 14px;
      font: inherit; cursor: pointer; transition: .2s ease;
    }
    .new-day:hover { background: rgba(10,157,91,.16); }

    /* Learned Kanji */
    .learned-list { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px; }
    .learned-btn {
      display: flex; flex-direction: column; align-items: center; gap: 3px;
      border: 1px solid var(--border); background: #fff; border-radius: 14px;
      padding: 10px 14px; cursor: pointer; transition: .18s ease; font: inherit;
    }
    .learned-btn:hover, .learned-btn.active {
      background: var(--green-soft); border-color: var(--border-strong);
    }
    .learned-char { font-size: 26px; font-weight: 700; color: var(--green); line-height: 1; }
    .learned-day  { font-size: 10px; color: var(--muted-2); }

    /* ── Main ── */
    main { padding: 34px; }

    .hero {
      border: 1px solid var(--border); border-radius: var(--radius-xl);
      padding: 30px;
      background: linear-gradient(135deg,rgba(10,157,91,.08),transparent 42%),#fff;
      box-shadow: var(--shadow); position: relative; overflow: hidden; margin-bottom: 24px;
    }
    .hero::after {
      content:""; position: absolute; right:-120px; top:-120px;
      width:280px; height:280px; border-radius:50%;
      border:1px solid rgba(10,157,91,.16);
    }
    .eyebrow { color: var(--green); font-size:13px; font-weight:700; margin:0 0 8px; }
    .hero h2 { font-size: clamp(34px,4vw,56px); line-height:1; letter-spacing:-.05em; margin:0; }
    .hero p  { color: var(--muted); margin:14px 0 0; max-width:640px; line-height:1.7; }
    .stats { display:flex; gap:12px; flex-wrap:wrap; margin-top:22px; }
    .stat {
      border:1px solid var(--border); background:rgba(15,30,22,.03);
      padding:10px 14px; border-radius:999px; color:var(--muted); font-size:13px;
    }
    .stat strong { color:var(--text); margin-right:4px; }

    .input-card {
      display:grid; grid-template-columns:1fr auto; gap:12px;
      border:1px solid var(--border); border-radius:var(--radius-lg);
      background:#fff; box-shadow:var(--shadow); padding:16px; margin-bottom:24px;
    }
    .input-card input {
      min-width:0; border:1px solid var(--border); background:var(--field);
      color:var(--text); border-radius:16px; padding:16px 18px;
      font-size:18px; outline:none; font-family:inherit;
    }
    .input-card input:focus { border-color:var(--border-strong); background:#fff; box-shadow:0 0 0 4px rgba(10,157,91,.10); }
    .btn-primary {
      border:0; background:var(--green); color:#fff; border-radius:16px;
      padding:0 22px; font-weight:800; font-family:inherit; cursor:pointer; transition:.15s ease;
    }
    .btn-primary:hover { filter:brightness(1.08); }

    .section-title { display:flex; align-items:center; justify-content:space-between; margin:30px 0 14px; gap:12px; }
    .section-title h3 { margin:0; font-size:18px; letter-spacing:-.02em; }
    .section-title span { color:var(--muted-2); font-size:13px; }
    .add-toggle {
      border:1px solid var(--border-strong); background:var(--green-soft);
      color:var(--green); border-radius:12px; padding:9px 14px;
      font:inherit; font-weight:700; font-size:13px; cursor:pointer; transition:.15s ease;
    }
    .add-toggle:hover { background:rgba(10,157,91,.16); }

    /* Kanji card */
    .kanji-card {
      border:1px solid var(--border); background:#fff;
      border-radius:var(--radius-xl); padding:30px; transition:.2s ease; position:relative;
      box-shadow:var(--shadow);
    }
    .kanji-card:hover { border-color:var(--border-strong); }
    .kanji-head {
      display:flex; gap:24px; align-items:center; margin-bottom:22px;
      padding-bottom:22px; border-bottom:1px solid var(--border);
    }
    .kanji-char {
      width:132px; height:132px; border-radius:28px; display:grid; place-items:center;
      font-size:84px; font-weight:700; color:var(--green);
      background:var(--green-soft); border:1px solid var(--border-strong); flex-shrink:0;
    }
    .kanji-card h4 { margin:0; font-size:26px; letter-spacing:-.02em; }
    .kanji-card .meaning { color:var(--muted); font-size:15px; margin-top:6px; }
    .kanji-readings { display:flex; gap:10px; flex-wrap:wrap; margin-top:14px; }
    .reading-chip {
      border:1px solid var(--border); background:var(--field); border-radius:10px;
      padding:6px 12px; font-size:13px; color:var(--text);
    }
    .reading-chip b { color:var(--muted-2); font-weight:500; margin-right:6px; }

    /* Emphasized words */
    .words-head { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:12px; }
    .words-label {
      font-size:12px; text-transform:uppercase; letter-spacing:.1em;
      color:var(--green); font-weight:700;
    }
    .audio-btn {
      display:inline-flex; align-items:center; gap:9px;
      border:0; background:var(--green); color:#fff;
      border-radius:999px; padding:13px 24px;
      font:inherit; font-weight:800; font-size:15px; cursor:pointer; transition:.15s ease;
      box-shadow:0 8px 20px var(--green-glow);
    }
    .audio-btn:hover { filter:brightness(1.07); transform:translateY(-1px); }
    .audio-btn.playing { background:#f08c00; box-shadow:0 8px 20px rgba(240,140,0,.30); }
    .word-list { display:grid; gap:14px; }

    /* group sub-header (On'yomi / Kun'yomi) */
    .word-sub {
      display:flex; align-items:center; gap:9px;
      font-size:14px; font-weight:700; color:var(--text);
      margin:24px 0 14px;
    }
    .word-sub::before { content:""; width:7px; height:7px; border-radius:50%; background:var(--green); }
    .sub-read {
      font-size:13px; font-weight:700; color:var(--green);
      background:var(--green-soft); border:1px solid var(--border-strong);
      border-radius:999px; padding:2px 11px;
    }

    /* unified word card: header + example */
    .word-card {
      border:1px solid var(--border); border-radius:18px; background:#fff;
      overflow:hidden; box-shadow:0 4px 14px rgba(15,40,28,.05); transition:.18s ease;
    }
    .word-card:hover { border-color:var(--border-strong); box-shadow:0 10px 26px rgba(15,40,28,.09); transform:translateY(-2px); }
    .word-head {
      display:flex; align-items:baseline; gap:12px; flex-wrap:wrap;
      padding:16px 20px;
      background:linear-gradient(180deg,var(--green-soft),#fff);
      border-bottom:1px solid var(--border);
    }
    .word-jp      { font-size:24px; font-weight:700; color:var(--text); letter-spacing:-.01em; }
    .word-reading { font-size:15px; font-weight:600; color:var(--green); }
    .word-meaning {
      margin-left:auto; font-size:13px; color:var(--muted);
      background:#fff; border:1px solid var(--border); border-radius:999px; padding:4px 12px;
    }
    .word-ex { padding:16px 20px; position:relative; }
    .word-ex .ex-tag {
      display:inline-block; font-size:10px; font-weight:700; letter-spacing:.1em;
      text-transform:uppercase; color:var(--green);
      background:var(--green-soft); border:1px solid var(--border-strong);
      border-radius:6px; padding:3px 8px; margin-bottom:10px;
    }
    .word-ex p { margin:0; }
    .word-ex .jp   { font-size:18px; line-height:1.65; font-weight:500; color:var(--text); margin-bottom:5px; }
    .word-ex .hira { font-size:13px; color:var(--green); margin-bottom:3px; }
    .word-ex .ko   { font-size:13px; color:var(--muted); }


    /* Sentences */
    .sentences { display:grid; gap:14px; }
    .sentence-card {
      border:1px solid var(--border); background:#fff;
      border-radius:var(--radius-lg); padding:20px;
      box-shadow:0 6px 18px rgba(15,40,28,.05);
    }
    .sentence-card .jp   { font-size:20px; line-height:1.7; margin:0 0 8px; color:var(--text); }
    .sentence-card .hira { margin:0 0 8px; color:var(--green); font-size:14px; }
    .sentence-card .ko   { margin:0; color:var(--muted); font-size:14px; }

    .note  { color:var(--muted-2); font-size:12px; margin-top:14px; line-height:1.7; }
    .empty {
      border:1px dashed var(--border); border-radius:var(--radius-lg);
      padding:40px; text-align:center; color:var(--muted-2); font-size:14px; line-height:1.8;
    }

    /* Add form */
    .form-card {
      border:1px solid var(--border-strong); border-radius:var(--radius-lg);
      background:#fff; box-shadow:var(--shadow); padding:24px; margin-bottom:24px;
      display:none;
    }
    .form-card.open { display:block; animation:fade .2s ease; }
    @keyframes fade { from{opacity:0;transform:translateY(-6px)} to{opacity:1;transform:none} }
    .form-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:14px; }
    .field { display:flex; flex-direction:column; gap:6px; }
    .field.full { grid-column:1/-1; }
    .field label { font-size:12px; color:var(--muted); letter-spacing:.02em; }
    .field input, .field textarea {
      border:1px solid var(--border); background:var(--field); color:var(--text);
      border-radius:12px; padding:12px 14px; font:inherit; font-size:15px; outline:none; resize:vertical;
    }
    .field input:focus, .field textarea:focus {
      border-color:var(--border-strong); background:#fff; box-shadow:0 0 0 4px rgba(10,157,91,.10);
    }
    .field .hint { font-size:11px; color:var(--muted-2); }
    .form-actions { display:flex; gap:10px; margin-top:18px; }
    .btn-ghost {
      border:1px solid var(--border); background:transparent; color:var(--muted);
      border-radius:12px; padding:12px 18px; font:inherit; cursor:pointer; transition:.15s ease;
    }
    .btn-ghost:hover { color:var(--text); border-color:var(--border-strong); }

    /* ── Animations & 3D emoji ── */
    @keyframes fadeUp { from{opacity:0;transform:translateY(14px)} to{opacity:1;transform:none} }
    @keyframes pop    { from{opacity:0;transform:scale(.72)} to{opacity:1;transform:scale(1)} }
    @keyframes floaty { 0%,100%{transform:translateY(0) rotate(-5deg)} 50%{transform:translateY(-10px) rotate(5deg)} }

    .hero { animation: fadeUp .5s ease both; }
    .kanji-card { animation: fadeUp .5s ease both; }
    .kanji-char { animation: pop .55s cubic-bezier(.2,.8,.3,1.2) both; transition: transform .2s ease; }
    .kanji-card:hover .kanji-char { transform: rotate(-4deg) scale(1.04); }
    .word-card { animation: fadeUp .45s ease both; }
    .word-list .word-card:nth-child(2){ animation-delay:.06s }
    .word-list .word-card:nth-child(3){ animation-delay:.12s }
    .word-list .word-card:nth-child(4){ animation-delay:.18s }

    .emoji3d { width:1.15em; height:1.15em; vertical-align:-.22em; }
    .btn-emoji { width:20px; height:20px; }
    .hero-emoji {
      position:absolute; z-index:1; pointer-events:none;
      filter: drop-shadow(0 10px 16px rgba(15,40,28,.18));
    }
    .hero-emoji.he1 { right:34px;  top:22px;  width:54px; height:54px; animation: floaty 4.5s ease-in-out infinite; }
    .hero-emoji.he2 { right:96px;  top:58px;  width:44px; height:44px; animation: floaty 5.5s ease-in-out infinite .5s; }
    .hero-emoji.he3 { right:26px;  top:86px;  width:40px; height:40px; animation: floaty 5s   ease-in-out infinite 1s; }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
    }

    @media (max-width:820px) {
      .app { grid-template-columns:1fr; }
      aside { position:static; height:auto; border-right:0; border-bottom:1px solid var(--border); }
      main { padding:22px; }
      .input-card { grid-template-columns:1fr; }
      .input-card .btn-primary { padding:15px; }
      .kanji-head { flex-direction:column; text-align:center; align-items:center; }
      .kanji-readings { justify-content:center; }
      .word-meaning { margin-left:0; }
      .hero-emoji.he1 { width:38px; height:38px; right:16px; top:16px; }
      .hero-emoji.he2 { width:30px; height:30px; right:60px; top:44px; }
      .hero-emoji.he3 { display:none; }
    }
  </style>
</head>
<body>
<div class="app">
  <!-- ── Sidebar ── -->
  <aside>
    <div class="brand">
      <div class="logo" aria-label="Daily Japanese logo">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round">
          <rect x="6" y="3.5" width="12" height="17" rx="2.5"/>
          <line x1="6" y1="12" x2="18" y2="12"/>
        </svg>
      </div>
      <div>
        <h1>Daily Japanese</h1>
        <p>Learn Japanese through basic kanji</p>
      </div>
    </div>

    <div class="side-label">Study Days</div>
    <div class="day-list" id="dayList"></div>
    <button class="new-day" onclick="addNewDay()">+ New Day</button>

    <div class="side-label"><img class="emoji3d" src="https://cdn.jsdelivr.net/gh/microsoft/fluentui-emoji@latest/assets/Books/3D/books_3d.png" alt=""> Learned Kanji</div>
    <div class="learned-list" id="learnedList"></div>
  </aside>

  <!-- ── Main ── -->
  <main>
    <section class="hero">
      <img class="hero-emoji he1" src="https://cdn.jsdelivr.net/gh/microsoft/fluentui-emoji@latest/assets/Pencil/3D/pencil_3d.png" alt="">
      <img class="hero-emoji he2" src="https://cdn.jsdelivr.net/gh/microsoft/fluentui-emoji@latest/assets/Open%20book/3D/open_book_3d.png" alt="">
      <img class="hero-emoji he3" src="https://cdn.jsdelivr.net/gh/microsoft/fluentui-emoji@latest/assets/Smiling%20face%20with%20smiling%20eyes/3D/smiling_face_with_smiling_eyes_3d.png" alt="">
      <p class="eyebrow" id="heroEyebrow">Day 1</p>
      <h2 id="heroTitle">一 · one / first / best</h2>
      <p>Learn Japanese vocabulary through basic kanji! Use the Play button below to hear each word before you study.</p>
      <div class="stats">
        <div class="stat"><strong id="statDays">1</strong>days</div>
        <div class="stat"><strong id="statWords">3</strong>words</div>
        <div class="stat"><strong id="statSentence">2</strong>examples</div>
      </div>
    </section>

    <div class="section-title">
      <h3 id="sectionTitle">Day 1 Kanji</h3>
    </div>



    <div id="kanjiArea"></div>

  </main>
</div>

<script>
  /* ── State ── */
  const STORE_KEY = "jastudy_v8";

  const SEED = {
    currentDay: 1,
    totalDays: 3,
    days: [
      {
        day: 1,
        kanji: "一", title: "one / first / best", meaning: "the number one",
        onReading: "いち", kunReading: "ひと",
        audio: "https://marketing.gilbut.co.kr/qr/eztok/book/301242/001.mp3",
        onWords: [
          { w:"一番", r:"いちばん", m:"best, most",
            ex:["君が一番だよ！","きみが いちばんだよ！","You're the best!"] },
          { w:"一日", r:"いちにち", m:"one day, all day",
            ex:["今日は一日家にいました。","きょうは いちにち いえに いました。","I stayed home all day today."] },
          { w:"一列", r:"いちれつ", m:"a row, a line",
            ex:["学生が一列に並んでいます。","がくせいが いちれつに ならんでいます。","The students are standing in a row."] },
          { w:"一度", r:"いちど", m:"once, one time",
            ex:["一度日本に行きたいです。","いちど にほんに いきたいです。","I'd like to go to Japan once."] }
        ],
        kunWords: [
          { w:"一つ", r:"ひとつ", m:"one (thing)",
            ex:["一つ選んでください。","ひとつ えらんでください。","Please choose one."] },
          { w:"一言", r:"ひとこと", m:"a word, a remark",
            ex:["一言だけお願いします。","ひとことだけ おねがいします。","Just a word, please."] }
        ]
      }
    ]
  };

  let state = {};
  let currentDay = 1;

  function load() {
    try {
      const raw = localStorage.getItem(STORE_KEY);
      state = raw ? JSON.parse(raw) : JSON.parse(JSON.stringify(SEED));
    } catch(e) {
      state = JSON.parse(JSON.stringify(SEED));
    }
    currentDay = state.currentDay || 1;
  }

  function persist() {
    state.currentDay = currentDay;
    localStorage.setItem(STORE_KEY, JSON.stringify(state));
  }

  function getDayEntry(day) {
    return state.days.find(d => d.day === day) || null;
  }

  /* ── Helpers ── */
  function esc(s) {
    return String(s).replace(/[&<>"']/g, c =>
      ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  }

  function wordBlockHTML(item) {
    const meaning = item.m ? `<span class="word-meaning">${esc(item.m)}</span>` : "";
    const ex = (item.ex && item.ex.length) ? `
      <div class="word-ex">
        <span class="ex-tag">Example</span>
        <p class="jp">${esc(item.ex[0]||"")}</p>
        <p class="hira">${esc(item.ex[1]||"")}</p>
        <p class="ko">${esc(item.ex[2]||"")}</p>
      </div>` : "";
    return `
      <div class="word-card">
        <div class="word-head">
          <span class="word-jp">${esc(item.w)}</span>
          <span class="word-reading">${esc(item.r||"")}</span>
          ${meaning}
        </div>
        ${ex}
      </div>`;
  }

  function wordGroup(label, reading, arr) {
    if (!arr || !arr.length) return "";
    const read = reading ? `<span class="sub-read">${esc(reading)}</span>` : "";
    return `<div class="word-sub">${esc(label)}${read}</div>
            <div class="word-list">${arr.map(wordBlockHTML).join("")}</div>`;
  }

  function cardHTML(entry) {
    const on  = entry.onWords  || [];
    const kun = entry.kunWords || [];
    const hasWords = on.length || kun.length;
    return `
      <article class="kanji-card">
        <div class="kanji-head">
          <div class="kanji-char">${esc(entry.kanji)}</div>
          <div>
            <h4>${esc(entry.kanji)} · ${esc(entry.title||"")}</h4>
            <div class="meaning">${esc(entry.meaning||"")}</div>
            <div class="kanji-readings">
              <span class="reading-chip"><b>音讀</b>${esc(entry.onReading||"—")}</span>
              <span class="reading-chip"><b>訓讀</b>${esc(entry.kunReading||"—")}</span>
            </div>
          </div>
        </div>
        ${hasWords ? `
          <div class="words-head">
            <div class="words-label"><img class="emoji3d" src="https://cdn.jsdelivr.net/gh/microsoft/fluentui-emoji@latest/assets/Pencil/3D/pencil_3d.png" alt=""> Common words</div>
            ${entry.audio ? `<button class="audio-btn" onclick="toggleAudio(this, '${esc(entry.audio)}')"><img class="btn-emoji" src="https://cdn.jsdelivr.net/gh/microsoft/fluentui-emoji@latest/assets/Headphone/3D/headphone_3d.png" data-play="https://cdn.jsdelivr.net/gh/microsoft/fluentui-emoji@latest/assets/Headphone/3D/headphone_3d.png" data-pause="https://cdn.jsdelivr.net/gh/microsoft/fluentui-emoji@latest/assets/Pause%20button/3D/pause_button_3d.png" alt=""><span class="txt">Play word audio</span></button>` : ""}
          </div>
          ${wordGroup("音讀", entry.onReading, on)}
          ${wordGroup("訓讀", entry.kunReading, kun)}` : ""}
      </article>`;
  }

  /* ── Render ── */
  function render() {
    renderSidebar();
    renderMain();
  }

  function renderSidebar() {
    /* Day buttons */
    const dl = document.getElementById("dayList");
    dl.innerHTML = "";
    for (let d = 1; d <= state.totalDays; d++) {
      const entry = getDayEntry(d);
      const isDone = !!entry;
      const btn = document.createElement("button");
      btn.className = "day-button" + (d === currentDay ? " active" : "");
      btn.innerHTML = `<span>Day ${d}</span><span class="badge${isDone ? " done" : ""}">${isDone ? "Done" : "ready"}</span>`;
      btn.onclick = () => goToDay(d);
      dl.appendChild(btn);
    }

    /* Learned Kanji */
    const ll = document.getElementById("learnedList");
    const learned = state.days.slice().sort((a,b) => a.day - b.day);
    if (learned.length === 0) {
      ll.innerHTML = `<span style="color:var(--muted-2);font-size:12px;padding:4px 10px">None yet</span>`;
    } else {
      ll.innerHTML = learned.map(e => `
        <button class="learned-btn${e.day === currentDay ? " active" : ""}" onclick="goToDay(${e.day})">
          <span class="learned-char">${esc(e.kanji)}</span>
          <span class="learned-day">D${e.day}</span>
        </button>`).join("");
    }
  }

  function renderMain() {
    const entry = getDayEntry(currentDay);

    /* Hero eyebrow */
    document.getElementById("heroEyebrow").textContent = `Day ${currentDay}`;
    document.getElementById("heroTitle").textContent =
      entry ? `${entry.kanji} · ${entry.title}` : "Today's kanji";
    document.getElementById("sectionTitle").textContent = `Day ${currentDay} Kanji`;

    /* Stats */
    const countWords = d => (d.onWords||[]).length + (d.kunWords||[]).length;
    const countEx = d => [...(d.onWords||[]), ...(d.kunWords||[])].filter(w => w.ex && w.ex.length).length;
    const totalWords     = state.days.reduce((n,d)=>n+countWords(d), 0);
    const totalSentences = state.days.reduce((n,d)=>n+countEx(d), 0);
    document.getElementById("statDays").textContent     = state.days.length;
    document.getElementById("statWords").textContent    = totalWords;
    document.getElementById("statSentence").textContent = totalSentences;

    /* Kanji card (words + examples inside) */
    const area = document.getElementById("kanjiArea");
    if (!entry) {
      area.innerHTML = `<div class="empty">No kanji for Day ${currentDay} yet.</div>`;
    } else {
      area.innerHTML = cardHTML(entry);
    }
  }

  /* ── Navigation ── */
  function goToDay(day) {
    currentDay = day;
    persist();
    render();
  }

  function addNewDay() {
    state.totalDays = (state.totalDays || 1) + 1;
    goToDay(state.totalDays);
  }

  /* ── Audio ── */
  let currentAudio = null;
  let currentBtn = null;

  function resetBtn(btn) {
    if (!btn) return;
    btn.classList.remove("playing");
    btn.querySelector(".txt").textContent = "Play word audio";
    const im = btn.querySelector(".btn-emoji");
    if (im && im.dataset.play) im.src = im.dataset.play;
  }

  function toggleAudio(btn, src) {
    // tap the same button again to stop
    if (currentAudio && currentBtn === btn && !currentAudio.paused) {
      currentAudio.pause();
      return;
    }
    // stop any other audio that's playing
    if (currentAudio) { currentAudio.pause(); resetBtn(currentBtn); }

    currentAudio = new Audio(src);
    currentBtn = btn;

    currentAudio.onplay  = () => {
      btn.classList.add("playing");
      btn.querySelector(".txt").textContent = "Pause";
      const im = btn.querySelector(".btn-emoji");
      if (im && im.dataset.pause) im.src = im.dataset.pause;
    };
    currentAudio.onpause = () => resetBtn(btn);
    currentAudio.onended = () => resetBtn(btn);
    currentAudio.onerror = () => { resetBtn(btn); alert("Couldn't load the audio. Please check your connection or the URL."); };

    currentAudio.play().catch(() => {
      resetBtn(btn);
      alert("Couldn't start playback.");
    });
  }

  load();
  render();
</script>
</body>
</html>
