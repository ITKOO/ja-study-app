  <style>
    :root {
      --bg:#fff; --bg-soft:#f4f8f6;
      --border:rgba(15,30,22,.10); --border-strong:rgba(10,157,91,.40);
      --text:#0d1a13; --muted:#5b6b62; --muted-2:#8a958f;
      --green:#0a9d5b; --green-soft:rgba(10,157,91,.10); --green-glow:rgba(10,157,91,.20);
      --field:#f4f8f6; --danger:#e5484d; --shadow:0 18px 50px rgba(15,40,28,.10);
      --radius-xl:28px; --radius-lg:22px;
    }
    * { box-sizing:border-box; }
    html { -webkit-text-size-adjust:100%; }
    body {
      margin:0; min-height:100vh;
      font-family:"LINE Seed JP","Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;
      background:radial-gradient(circle at 20% 0%,rgba(10,157,91,.08),transparent 32%),
                 radial-gradient(circle at 80% 10%,rgba(10,157,91,.05),transparent 28%),
                 linear-gradient(180deg,#fff 0%,#f4f8f6 100%);
      color:var(--text); -webkit-tap-highlight-color:transparent;
    }
    .app { display:grid; grid-template-columns:290px 1fr; min-height:100vh; }

    /* Sidebar */
    aside {
      border-right:1px solid var(--border); background:rgba(255,255,255,.82);
      backdrop-filter:blur(18px); padding:24px 20px;
      position:sticky; top:0; height:100vh; display:flex; flex-direction:column; overflow-y:auto;
    }
    .lang-switch {
      display:inline-flex; align-self:flex-start; gap:4px;
      background:var(--green-soft); border:1px solid var(--border-strong);
      border-radius:999px; padding:4px; margin-bottom:18px;
    }
    .lang-btn {
      border:0; background:transparent; color:var(--muted); font:inherit; font-weight:700;
      font-size:12px; padding:7px 13px; border-radius:999px; cursor:pointer; transition:.15s ease;
    }
    .lang-btn.active { background:var(--green); color:#fff; }
    .brand { display:flex; align-items:center; gap:12px; margin-bottom:30px; }
    .logo {
      width:42px; height:42px; border-radius:14px; flex-shrink:0;
      background:linear-gradient(135deg,#3ecf8e,#14784d);
      display:grid; place-items:center; color:#fff; font-weight:800;
      box-shadow:0 6px 20px var(--green-glow);
    }
    .brand h1 { font-size:18px; margin:0; letter-spacing:-.02em; }
    .brand p  { margin:3px 0 0; color:var(--muted); font-size:12px; }
    .side-label { font-size:11px; text-transform:uppercase; letter-spacing:.12em; color:var(--muted-2); margin:22px 10px 10px; }
    .day-list { display:grid; gap:8px; }
    .day-button {
      width:100%; border:1px solid transparent; background:transparent; color:var(--muted);
      padding:13px 14px; border-radius:14px; text-align:left;
      display:flex; justify-content:space-between; align-items:center; cursor:pointer; font:inherit; transition:.2s ease;
    }
    .day-button:hover { background:var(--green-soft); color:var(--text); }
    .day-button.active { background:var(--green-soft); color:var(--text); border-color:var(--border-strong); }
    .badge {
      font-size:11px; color:var(--green); background:var(--green-soft);
      border:1px solid var(--border-strong); padding:3px 8px; border-radius:999px; white-space:nowrap;
    }
    .badge.done { color:#fff; background:var(--green); border-color:var(--green); }
    .new-day {
      margin-top:12px; width:100%; border:1px dashed var(--border-strong); background:var(--green-soft);
      color:var(--green); padding:13px 14px; border-radius:14px; font:inherit; cursor:pointer; transition:.2s ease;
    }
    .new-day:hover { background:rgba(10,157,91,.16); }
    .learned-list { display:flex; flex-wrap:wrap; gap:8px; margin-top:4px; }
    .learned-btn {
      display:flex; flex-direction:column; align-items:center; gap:3px;
      border:1px solid var(--border); background:#fff; border-radius:14px;
      padding:10px 14px; cursor:pointer; transition:.18s ease; font:inherit;
    }
    .learned-btn:hover, .learned-btn.active { background:var(--green-soft); border-color:var(--border-strong); }
    .learned-char { font-size:26px; font-weight:700; color:var(--green); line-height:1; }
    .learned-day  { font-size:10px; color:var(--muted-2); }

    /* Main */
    main { padding:34px; }
    .hero {
      border:1px solid var(--border); border-radius:var(--radius-xl); padding:30px;
      background:linear-gradient(135deg,rgba(10,157,91,.08),transparent 42%),#fff;
      box-shadow:var(--shadow); position:relative; overflow:hidden; margin-bottom:24px;
    }
    .hero::after { content:""; position:absolute; right:-120px; top:-120px; width:280px; height:280px; border-radius:50%; border:1px solid rgba(10,157,91,.16); }
    .eyebrow { color:var(--green); font-size:13px; font-weight:700; margin:0 0 8px; }
    .hero h2 { font-size:clamp(32px,4vw,56px); line-height:1.05; letter-spacing:-.05em; margin:0; }
    .hero p  { color:var(--muted); margin:14px 0 0; max-width:640px; line-height:1.7; }
    .stats { display:flex; gap:12px; flex-wrap:wrap; margin-top:22px; }
    .stat { border:1px solid var(--border); background:rgba(15,30,22,.03); padding:10px 14px; border-radius:999px; color:var(--muted); font-size:13px; }
    .stat strong { color:var(--text); margin-right:4px; }

    .section-title { display:flex; align-items:center; justify-content:space-between; margin:30px 0 14px; gap:12px; }
    .section-title h3 { margin:0; font-size:18px; letter-spacing:-.02em; }

    /* Kanji card */
    .kanji-card { border:1px solid var(--border); background:#fff; border-radius:var(--radius-xl); padding:30px; transition:.2s ease; position:relative; box-shadow:var(--shadow); }
    .kanji-card:hover { border-color:var(--border-strong); }
    .kanji-head { display:flex; gap:24px; align-items:center; margin-bottom:22px; padding-bottom:22px; border-bottom:1px solid var(--border); }
    .kanji-char {
      width:132px; height:132px; border-radius:28px; display:grid; place-items:center;
      font-size:84px; font-weight:700; color:var(--green);
      background:var(--green-soft); border:1px solid var(--border-strong); flex-shrink:0;
    }
    .kanji-card h4 { margin:0; font-size:26px; letter-spacing:-.02em; }
    .kanji-card .meaning { color:var(--muted); font-size:15px; margin-top:6px; }
    .kanji-readings { display:flex; gap:10px; flex-wrap:wrap; margin-top:14px; }
    .reading-chip { border:1px solid var(--border); background:var(--field); border-radius:10px; padding:6px 12px; font-size:13px; color:var(--text); }
    .reading-chip b { color:var(--muted-2); font-weight:500; margin-right:6px; }

    /* Words */
    .words-head { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:12px; flex-wrap:wrap; }
    .words-label { font-size:12px; text-transform:uppercase; letter-spacing:.1em; color:var(--green); font-weight:700; }
    .audio-btn {
      display:inline-flex; align-items:center; gap:9px; border:0; background:var(--green); color:#fff;
      border-radius:999px; padding:13px 24px; font:inherit; font-weight:800; font-size:15px;
      cursor:pointer; transition:.15s ease; box-shadow:0 8px 20px var(--green-glow);
    }
    .audio-btn:hover { filter:brightness(1.07); transform:translateY(-1px); }
    .audio-btn.playing { background:#f08c00; box-shadow:0 8px 20px rgba(240,140,0,.30); }
    .btn-emoji { width:20px; height:20px; }
    .word-list { display:grid; gap:14px; }
    .word-sub { display:flex; align-items:center; gap:9px; font-size:14px; font-weight:700; color:var(--text); margin:24px 0 14px; }
    .word-sub::before { content:""; width:7px; height:7px; border-radius:50%; background:var(--green); }
    .sub-read { font-size:13px; font-weight:700; color:var(--green); background:var(--green-soft); border:1px solid var(--border-strong); border-radius:999px; padding:2px 11px; }
    .word-card { border:1px solid var(--border); border-radius:18px; background:#fff; overflow:hidden; box-shadow:0 4px 14px rgba(15,40,28,.05); transition:.18s ease; }
    .word-card:hover { border-color:var(--border-strong); box-shadow:0 10px 26px rgba(15,40,28,.09); transform:translateY(-2px); }
    .word-head { display:flex; align-items:baseline; gap:12px; flex-wrap:wrap; padding:16px 20px; background:linear-gradient(180deg,var(--green-soft),#fff); border-bottom:1px solid var(--border); }
    .word-jp { font-size:24px; font-weight:700; color:var(--text); letter-spacing:-.01em; }
    .word-reading { font-size:15px; font-weight:600; color:var(--green); }
    .word-meaning { margin-left:auto; font-size:13px; color:var(--muted); background:#fff; border:1px solid var(--border); border-radius:999px; padding:4px 12px; }
    .word-ex { padding:16px 20px; }
    .word-ex .ex-tag { display:inline-block; font-size:10px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:var(--green); background:var(--green-soft); border:1px solid var(--border-strong); border-radius:6px; padding:3px 8px; margin-bottom:10px; }
    .word-ex p { margin:0; }
    .word-ex .jp { font-size:18px; line-height:1.65; font-weight:500; color:var(--text); margin-bottom:5px; }
    .word-ex .hira { font-size:13px; color:var(--green); margin-bottom:3px; }
    .word-ex .ko { font-size:13px; color:var(--muted); }
    .empty { border:1px dashed var(--border); border-radius:var(--radius-lg); padding:40px; text-align:center; color:var(--muted-2); font-size:14px; line-height:1.8; }

    /* Quiz */
    .quiz-card { border:1px solid var(--border); background:#fff; border-radius:var(--radius-xl); padding:26px; box-shadow:var(--shadow); animation:fadeUp .4s ease both; }
    .quiz-intro { text-align:center; }
    .quiz-emoji { width:64px; height:64px; }
    .quiz-intro-text { color:var(--muted); margin:12px 0 18px; }
    .quiz-head { display:flex; justify-content:space-between; color:var(--muted-2); font-size:13px; font-weight:700; margin-bottom:14px; }
    .quiz-label { font-size:12px; text-transform:uppercase; letter-spacing:.1em; color:var(--green); font-weight:700; margin-bottom:10px; }
    .quiz-prompt { font-size:24px; font-weight:700; color:var(--text); line-height:1.5; text-align:center; }
    .quiz-prompt .q-read { font-size:16px; font-weight:600; color:var(--green); margin-left:8px; }
    .quiz-prompt.blank-q {
      background:linear-gradient(180deg,var(--green-soft),#fff);
      border:1px solid var(--border); border-radius:16px;
      padding:24px 20px; line-height:1.8; font-size:22px;
    }
    .quiz-prompt .blank {
      display:inline-flex; align-items:center; justify-content:center;
      min-width:58px; padding:2px 14px; margin:0 4px; vertical-align:middle;
      background:#fff; border:2px dashed var(--green); border-radius:10px;
      color:var(--green); font-weight:800;
    }
    .quiz-hint { color:var(--muted); font-size:14px; margin-top:10px; text-align:center; }
    .quiz-options { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:18px; }
    .opt { border:1px solid var(--border); background:var(--field); color:var(--text); border-radius:14px; padding:16px; font:inherit; font-size:16px; font-weight:600; cursor:pointer; transition:.15s ease; text-align:center; }
    .opt:hover:not(:disabled) { border-color:var(--border-strong); background:var(--green-soft); }
    .opt:disabled { cursor:default; }
    .opt.correct { background:var(--green); color:#fff; border-color:var(--green); }
    .opt.wrong { background:rgba(229,72,77,.10); color:var(--danger); border-color:rgba(229,72,77,.45); }
    .opt.dim { opacity:.45; }
    .quiz-footer { display:flex; align-items:center; justify-content:space-between; gap:14px; margin-top:20px; flex-wrap:wrap; }
    .quiz-fb { font-weight:800; font-size:16px; margin:0; }
    .quiz-fb.ok { color:var(--green); }
    .quiz-fb.no { color:var(--danger); }
    .quiz-next { margin:0; margin-left:auto; padding:15px 34px; border-radius:14px; font-size:16px; }
    .quiz-result { text-align:center; }
    .result-emoji { width:76px; height:76px; margin:0 auto; display:block; }
    .result-msg { font-size:22px; font-weight:800; margin:14px 0 20px; }
    .result-actions { display:flex; gap:10px; justify-content:center; flex-wrap:wrap; }
    .btn-ghost2 { border:1px solid var(--border); background:transparent; color:var(--muted); border-radius:14px; padding:13px 24px; font:inherit; font-weight:700; cursor:pointer; transition:.15s ease; }
    .btn-ghost2:hover { border-color:var(--border-strong); color:var(--text); }

    /* Animations & 3D emoji */
    @keyframes fadeUp { from{opacity:0;transform:translateY(14px)} to{opacity:1;transform:none} }
    @keyframes pop    { from{opacity:0;transform:scale(.72)} to{opacity:1;transform:scale(1)} }
    @keyframes floaty { 0%,100%{transform:translateY(0) rotate(-5deg)} 50%{transform:translateY(-10px) rotate(5deg)} }
    .hero { animation:fadeUp .5s ease both; }
    .kanji-card { animation:fadeUp .5s ease both; }
    .kanji-char { animation:pop .55s cubic-bezier(.2,.8,.3,1.2) both; transition:transform .2s ease; }
    .kanji-card:hover .kanji-char { transform:rotate(-4deg) scale(1.04); }
    .word-card { animation:fadeUp .45s ease both; }
    .word-list .word-card:nth-child(2){ animation-delay:.06s }
    .word-list .word-card:nth-child(3){ animation-delay:.12s }
    .word-list .word-card:nth-child(4){ animation-delay:.18s }
    .emoji3d { width:1.15em; height:1.15em; vertical-align:-.22em; }
    .hero-emoji { position:absolute; z-index:1; pointer-events:none; filter:drop-shadow(0 10px 16px rgba(15,40,28,.18)); }
    .hero-emoji.he1 { right:34px; top:22px; width:54px; height:54px; animation:floaty 4.5s ease-in-out infinite; }
    .hero-emoji.he2 { right:96px; top:58px; width:44px; height:44px; animation:floaty 5.5s ease-in-out infinite .5s; }
    .hero-emoji.he3 { right:26px; top:86px; width:40px; height:40px; animation:floaty 5s ease-in-out infinite 1s; }
    @media (prefers-reduced-motion: reduce) { *,*::before,*::after { animation:none !important; transition:none !important; } }

    /* Tablet / mobile */
    @media (max-width:820px) {
      .app { grid-template-columns:1fr; }
      aside { position:static; height:auto; border-right:0; border-bottom:1px solid var(--border); padding:18px 16px; }
      main { padding:20px 16px; }
      .hero { padding:22px; }
      .kanji-card { padding:22px; }
      .kanji-head { flex-direction:column; text-align:center; align-items:center; gap:16px; }
      .kanji-readings { justify-content:center; }
      .kanji-char { width:104px; height:104px; font-size:64px; border-radius:24px; }
      .kanji-card h4 { font-size:22px; }
      .word-meaning { margin-left:0; }
      .audio-btn { width:100%; justify-content:center; }
      .hero-emoji.he1 { width:38px; height:38px; right:16px; top:16px; }
      .hero-emoji.he2 { width:30px; height:30px; right:60px; top:44px; }
      .hero-emoji.he3 { display:none; }
    }
    @media (max-width:480px) {
      main { padding:16px 14px; }
      .hero { padding:18px; }
      .kanji-card { padding:16px; }
      .kanji-char { width:88px; height:88px; font-size:54px; }
      .word-head { padding:14px 16px; }
      .word-jp { font-size:22px; }
      .word-ex { padding:14px 16px; }
      .word-ex .jp { font-size:16px; }
      .stats { gap:8px; }
      .stat { padding:8px 12px; font-size:12px; }
      .quiz-options { grid-template-columns:1fr; }
      .quiz-prompt { font-size:20px; }
      .quiz-footer { flex-direction:column; align-items:stretch; }
      .quiz-next { margin-left:0; width:100%; }
    }
  </style>
</head>
<body>
<div class="app">
  <aside>
    <div class="lang-switch" id="langSwitch">
      <button class="lang-btn" data-lang="en">EN</button>
      <button class="lang-btn" data-lang="ko">한국어</button>
    </div>

    <div class="brand">
      <div class="logo" aria-label="Daily Japanese logo">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round">
          <rect x="6" y="3.5" width="12" height="17" rx="2.5"/>
          <line x1="6" y1="12" x2="18" y2="12"/>
        </svg>
      </div>
      <div>
        <h1 data-i18n="appName">Daily Japanese</h1>
        <p data-i18n="tagline">Learn Japanese through basic kanji</p>
      </div>
    </div>

    <div class="side-label" data-i18n="studyDays">Study Days</div>
    <div class="day-list" id="dayList"></div>
    <button class="new-day" data-i18n="newDay" onclick="addNewDay()">+ New Day</button>

    <div class="side-label"><img class="emoji3d" src="https://cdn.jsdelivr.net/gh/microsoft/fluentui-emoji@latest/assets/Books/3D/books_3d.png" alt=""> <span data-i18n="learnedKanji">Learned Kanji</span></div>
    <div class="learned-list" id="learnedList"></div>
  </aside>

  <main>
    <section class="hero">
      <p class="eyebrow" id="heroEyebrow">Day 1</p>
      <h2 id="heroTitle"></h2>
      <p data-i18n="heroDesc"></p>
      <div class="stats">
        <div class="stat"><strong id="statDays">1</strong><span data-i18n="days">days</span></div>
        <div class="stat"><strong id="statWords">3</strong><span data-i18n="words">words</span></div>
        <div class="stat"><strong id="statSentence">2</strong><span data-i18n="examples">examples</span></div>
      </div>
    </section>

    <div class="section-title"><h3 id="sectionTitle"></h3></div>
    <div id="kanjiArea"></div>

    <div class="section-title"><h3 id="quizTitle"></h3></div>
    <div id="quizArea"></div>
  </main>
</div>

<script>
  const STORE_KEY = "jastudy_v9";

  const I18N = {
    en: {
      appName:"Daily Japanese", tagline:"Learn Japanese through basic kanji",
      studyDays:"Study Days", newDay:"+ New Day", learnedKanji:"Learned Kanji",
      heroDesc:"Learn Japanese vocabulary through basic kanji! Use the Play button below to hear each word before you study.",
      days:"days", words:"words", examples:"examples",
      kanjiWord:"Kanji", todaysKanji:"Today's kanji",
      commonWords:"Common words", example:"Example",
      playAudio:"Play word audio", pause:"Pause",
      done:"Done", ready:"ready", noneYet:"None yet",
      audioLoadErr:"Couldn't load the audio. Please check your connection or the URL.",
      audioPlayErr:"Couldn't start playback.",
      quiz:"Quiz", startQuiz:"Start quiz", quizIntro:"Test what you learned with a quick quiz.",
      labelMeaning:"What does this word mean?", labelBlank:"Fill in the blank",
      correct:"Correct!", wrong:"Not quite", next:"Next", finish:"See result",
      retry:"Try again", close:"Close", score:"Score", noQuiz:"Not enough words to make a quiz yet."
    },
    ko: {
      appName:"\ud558\ub8e8 \uc77c\ubcf8\uc5b4", tagline:"\uae30\ucd08 \ud55c\uc790\ub85c \uc77c\ubcf8\uc5b4 \ud559\uc2b5\ud558\uae30",
      studyDays:"\ud559\uc2b5\uc77c", newDay:"+ New Day", learnedKanji:"\ubc30\uc6b4 \ud55c\uc790",
      heroDesc:"\uae30\ucd08 \ud55c\uc790 \ub2e8\uc5b4\ub97c \ud1b5\ud574 \uc77c\ubcf8\uc5b4 \ub2e8\uc5b4\ub97c \ud559\uc2b5\ud574\uc694! \uc544\ub798 \ub4e3\uae30 \ubc84\ud2bc\uc73c\ub85c \ubbf8\ub9ac \ub2e8\uc5b4\ub97c \ub4e4\uc740 \ud6c4 \ud559\uc2b5\ud574 \ubcf4\uc138\uc694.",
      days:"\uc77c\ucc28", words:"\ub2e8\uc5b4", examples:"\uc608\ubb38",
      kanjiWord:"\ud55c\uc790", todaysKanji:"\uc624\ub298\uc758 \ud55c\uc790",
      commonWords:"\uc790\uc8fc \uc4f0\ub294 \ub2e8\uc5b4", example:"\uc608\ubb38",
      playAudio:"\ub2e8\uc5b4 \ub4e3\uae30", pause:"\uc815\uc9c0",
      done:"\uc644\ub8cc", ready:"\uc900\ube44", noneYet:"\uc544\uc9c1 \uc5c6\uc5b4\uc694",
      audioLoadErr:"\uc74c\uc6d0\uc744 \ubd88\ub7ec\uc624\uc9c0 \ubabb\ud588\uc5b4\uc694. \ub124\ud2b8\uc6cc\ud06c\ub098 \uc8fc\uc18c\ub97c \ud655\uc778\ud574\uc8fc\uc138\uc694.",
      audioPlayErr:"\uc7ac\uc0dd\uc744 \uc2dc\uc791\ud560 \uc218 \uc5c6\uc5b4\uc694.",
      quiz:"퀴즈", startQuiz:"퀴즈 시작", quizIntro:"간단한 퀴즈로 배운 내용을 확인해 보세요.",
      labelMeaning:"이 단어의 뜻은?", labelBlank:"빈칸에 들어갈 단어는?",
      correct:"정답!", wrong:"오답", next:"다음", finish:"결과 보기",
      retry:"다시 풀기", close:"닫기", score:"점수", noQuiz:"퀴즈를 만들 단어가 부족해요."
    }
  };

  const SEED = {
    currentDay:1, totalDays:3, lang:"en",
    days:[
      {
        day:1, kanji:"\u4e00",
        title:{en:"one / first / best", ko:"\ud558\ub098 / \uac00\uc7a5 / \uccab \ubc88\uc9f8"},
        meaning:{en:"the number one", ko:"\ud55c \uc77c"},
        onReading:"\u3044\u3061", kunReading:"\u3072\u3068",
        audio:"https://marketing.gilbut.co.kr/qr/eztok/book/301242/001.mp3",
        onWords:[
          { w:"\u4e00\u756a", r:"\u3044\u3061\u3070\u3093", m:{en:"best, most", ko:"\uac00\uc7a5, \uc81c\uc77c"},
            ex:{jp:"\u541b\u304c\u4e00\u756a\u3060\u3088\uff01", hira:"\u304d\u307f\u304c \u3044\u3061\u3070\u3093\u3060\u3088\uff01", en:"You're the best!", ko:"\ub124\uac00 \ucd5c\uace0\uc57c!"} },
          { w:"\u4e00\u65e5", r:"\u3044\u3061\u306b\u3061", m:{en:"one day, all day", ko:"\ud558\ub8e8"},
            ex:{jp:"\u4eca\u65e5\u306f\u4e00\u65e5\u5bb6\u306b\u3044\u307e\u3057\u305f\u3002", hira:"\u304d\u3087\u3046\u306f \u3044\u3061\u306b\u3061 \u3044\u3048\u306b \u3044\u307e\u3057\u305f\u3002", en:"I stayed home all day today.", ko:"\uc624\ub298\uc740 \ud558\ub8e8 \uc885\uc77c \uc9d1\uc5d0 \uc788\uc5c8\uc5b4\uc694."} },
          { w:"\u4e00\u5217", r:"\u3044\u3061\u308c\u3064", m:{en:"a row, a line", ko:"\ud55c \uc904"},
            ex:{jp:"\u5b66\u751f\u304c\u4e00\u5217\u306b\u4e26\u3093\u3067\u3044\u307e\u3059\u3002", hira:"\u304c\u304f\u305b\u3044\u304c \u3044\u3061\u308c\u3064\u306b \u306a\u3089\u3093\u3067\u3044\u307e\u3059\u3002", en:"The students are standing in a row.", ko:"\ud559\uc0dd\ub4e4\uc774 \ud55c \uc904\ub85c \uc11c \uc788\uc5b4\uc694."} },
          { w:"\u4e00\u5ea6", r:"\u3044\u3061\u3069", m:{en:"once, one time", ko:"\ud55c \ubc88"},
            ex:{jp:"\u4e00\u5ea6\u65e5\u672c\u306b\u884c\u304d\u305f\u3044\u3067\u3059\u3002", hira:"\u3044\u3061\u3069 \u306b\u307b\u3093\u306b \u3044\u304d\u305f\u3044\u3067\u3059\u3002", en:"I'd like to go to Japan once.", ko:"\ud55c\ubc88 \uc77c\ubcf8\uc5d0 \uac00\uace0 \uc2f6\uc5b4\uc694."} }
        ],
        kunWords:[
          { w:"\u4e00\u3064", r:"\u3072\u3068\u3064", m:{en:"one (thing)", ko:"\ud558\ub098"},
            ex:{jp:"\u4e00\u3064\u9078\u3093\u3067\u304f\u3060\u3055\u3044\u3002", hira:"\u3072\u3068\u3064 \u3048\u3089\u3093\u3067\u304f\u3060\u3055\u3044\u3002", en:"Please choose one.", ko:"\ud558\ub098 \uace8\ub77c \uc8fc\uc138\uc694."} },
          { w:"\u4e00\u8a00", r:"\u3072\u3068\u3053\u3068", m:{en:"a word, a remark", ko:"\ud55c\ub9c8\ub514"},
            ex:{jp:"\u4e00\u8a00\u3060\u3051\u304a\u9858\u3044\u3057\u307e\u3059\u3002", hira:"\u3072\u3068\u3053\u3068\u3060\u3051 \u304a\u306d\u304c\u3044\u3057\u307e\u3059\u3002", en:"Just a word, please.", ko:"\ud55c\ub9c8\ub514\ub9cc \ubd80\ud0c1\ub4dc\ub9bd\ub2c8\ub2e4."} }
        ]
      }
    ]
  };

  let state = {};
  let currentDay = 1;
  let lang = "en";

  function tr(){ return I18N[lang]; }
  function L(v){ return (v && typeof v==="object" && !Array.isArray(v)) ? (v[lang] ?? v.en ?? "") : (v||""); }

  function load() {
    try { const raw = localStorage.getItem(STORE_KEY); state = raw ? JSON.parse(raw) : JSON.parse(JSON.stringify(SEED)); }
    catch(e) { state = JSON.parse(JSON.stringify(SEED)); }
    currentDay = state.currentDay || 1;
    lang = state.lang || "en";
  }
  function persist() { state.currentDay = currentDay; state.lang = lang; localStorage.setItem(STORE_KEY, JSON.stringify(state)); }
  function getDayEntry(day){ return state.days.find(d => d.day === day) || null; }
  function esc(s){ return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

  function wordBlockHTML(item) {
    const meaning = item.m ? `<span class="word-meaning">${esc(L(item.m))}</span>` : "";
    const ex = item.ex ? `
      <div class="word-ex">
        <span class="ex-tag">${esc(tr().example)}</span>
        <p class="jp">${esc(item.ex.jp||"")}</p>
        <p class="hira">${esc(item.ex.hira||"")}</p>
        <p class="ko">${esc(item.ex[lang]||item.ex.en||"")}</p>
      </div>` : "";
    return `
      <div class="word-card">
        <div class="word-head">
          <span class="word-jp">${esc(item.w)}</span>
          <span class="word-reading">${esc(item.r||"")}</span>
          ${meaning}
        </div>
        ${ex}
      </div>`;
  }

  function wordGroup(label, reading, arr) {
    if (!arr || !arr.length) return "";
    const read = reading ? `<span class="sub-read">${esc(reading)}</span>` : "";
    return `<div class="word-sub">${esc(label)}${read}</div><div class="word-list">${arr.map(wordBlockHTML).join("")}</div>`;
  }

  function cardHTML(entry) {
    const on = entry.onWords || [], kun = entry.kunWords || [];
    const hasWords = on.length || kun.length;
    const HEAD = "https://cdn.jsdelivr.net/gh/microsoft/fluentui-emoji@latest/assets/Headphone/3D/headphone_3d.png";
    const PAUSE = "https://cdn.jsdelivr.net/gh/microsoft/fluentui-emoji@latest/assets/Pause%20button/3D/pause_button_3d.png";
    return `
      <article class="kanji-card">
        <div class="kanji-head">
          <div class="kanji-char">${esc(entry.kanji)}</div>
          <div>
            <h4>${esc(entry.kanji)} \u00b7 ${esc(L(entry.title))}</h4>
            <div class="meaning">${esc(L(entry.meaning))}</div>
            <div class="kanji-readings">
              <span class="reading-chip"><b>\u97f3\u8b80</b>${esc(entry.onReading||"\u2014")}</span>
              <span class="reading-chip"><b>\u8a13\u8b80</b>${esc(entry.kunReading||"\u2014")}</span>
            </div>
          </div>
        </div>
        ${hasWords ? `
          <div class="words-head">
            <div class="words-label">${esc(tr().commonWords)}</div>
            ${entry.audio ? `<button class="audio-btn" onclick="toggleAudio(this, '${esc(entry.audio)}')"><img class="btn-emoji" src="${HEAD}" data-play="${HEAD}" data-pause="${PAUSE}" alt=""><span class="txt">${esc(tr().playAudio)}</span></button>` : ""}
          </div>
          ${wordGroup("\u97f3\u8b80", entry.onReading, on)}
          ${wordGroup("\u8a13\u8b80", entry.kunReading, kun)}` : ""}
      </article>`;
  }

  function applyStatic() {
    const d = I18N[lang];
    document.title = d.appName;
    document.documentElement.lang = lang;
    document.querySelectorAll("[data-i18n]").forEach(el => { el.textContent = d[el.dataset.i18n]; });
    document.querySelectorAll(".lang-btn").forEach(b => b.classList.toggle("active", b.dataset.lang === lang));
  }

  function render() { renderSidebar(); renderMain(); }

  function renderSidebar() {
    const dl = document.getElementById("dayList");
    dl.innerHTML = "";
    for (let d = 1; d <= state.totalDays; d++) {
      const isDone = !!getDayEntry(d);
      const btn = document.createElement("button");
      btn.className = "day-button" + (d === currentDay ? " active" : "");
      btn.innerHTML = `<span>Day ${d}</span><span class="badge${isDone ? " done" : ""}">${isDone ? tr().done : tr().ready}</span>`;
      btn.onclick = () => goToDay(d);
      dl.appendChild(btn);
    }
    const ll = document.getElementById("learnedList");
    const learned = state.days.slice().sort((a,b)=>a.day-b.day);
    ll.innerHTML = learned.length
      ? learned.map(e => `<button class="learned-btn${e.day===currentDay?" active":""}" onclick="goToDay(${e.day})"><span class="learned-char">${esc(e.kanji)}</span><span class="learned-day">D${e.day}</span></button>`).join("")
      : `<span style="color:var(--muted-2);font-size:12px;padding:4px 10px">${esc(tr().noneYet)}</span>`;
  }

  function renderMain() {
    const entry = getDayEntry(currentDay);
    document.getElementById("heroEyebrow").textContent = `Day ${currentDay}`;
    document.getElementById("heroTitle").textContent = entry ? `${entry.kanji} \u00b7 ${L(entry.title)}` : tr().todaysKanji;
    document.getElementById("sectionTitle").textContent = `Day ${currentDay} ${tr().kanjiWord}`;
    const cw = d => (d.onWords||[]).length + (d.kunWords||[]).length;
    const ce = d => [...(d.onWords||[]),...(d.kunWords||[])].filter(w=>w.ex).length;
    document.getElementById("statDays").textContent = state.days.length;
    document.getElementById("statWords").textContent = state.days.reduce((n,d)=>n+cw(d),0);
    document.getElementById("statSentence").textContent = state.days.reduce((n,d)=>n+ce(d),0);
    const area = document.getElementById("kanjiArea");
    const noKanji = lang === "ko" ? `Day ${currentDay} 한자가 아직 없어요.` : `No kanji for Day ${currentDay} yet.`;
    area.innerHTML = entry ? cardHTML(entry) : `<div class="empty">${esc(noKanji)}</div>`;

    document.getElementById("quizTitle").textContent = tr().quiz;
    quiz = null;
    renderQuizIntro(entry);
  }

  function goToDay(day){ currentDay = day; persist(); render(); }
  function addNewDay(){ state.totalDays = (state.totalDays||1)+1; goToDay(state.totalDays); }

  function setLang(l){ lang = l; persist(); applyStatic(); render(); }

  /* Quiz */
  const EMO = "https://cdn.jsdelivr.net/gh/microsoft/fluentui-emoji@latest/assets/";
  let quiz = null;

  function shuffle(a){ a = a.slice(); for (let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

  function renderQuizIntro(entry){
    const qa = document.getElementById("quizArea");
    const words = entry ? [...(entry.onWords||[]), ...(entry.kunWords||[])] : [];
    if (words.length < 2) { qa.innerHTML = `<div class="empty">${esc(tr().noQuiz)}</div>`; return; }
    qa.innerHTML = `
      <div class="quiz-card quiz-intro">
        <img class="quiz-emoji" src="${EMO}Bullseye/3D/bullseye_3d.png" alt="">
        <div class="quiz-intro-text">${esc(tr().quizIntro)}</div>
        <button class="btn-primary" style="padding:14px 28px;border-radius:14px" onclick="startQuiz()">${esc(tr().startQuiz)}</button>
      </div>`;
  }

  function buildQuiz(entry){
    const words = [...(entry.onWords||[]), ...(entry.kunWords||[])];
    if (words.length < 2) return null;
    const qs = [];
    words.forEach(word => {
      // meaning multiple choice
      const otherM = shuffle(words.filter(x => x !== word).map(x => L(x.m))).slice(0,3);
      qs.push({
        type:"meaning",
        prompt:`${esc(word.w)} <span class="q-read">${esc(word.r||"")}</span>`,
        answer:L(word.m),
        options: shuffle([L(word.m), ...otherM])
      });
      // fill in the blank
      if (word.ex && word.ex.jp && word.ex.jp.indexOf(word.w) >= 0) {
        const blanked = esc(word.ex.jp).replace(esc(word.w), `<span class="blank">?</span>`);
        const otherW = shuffle(words.filter(x => x !== word).map(x => x.w)).slice(0,3);
        qs.push({
          type:"blank",
          prompt: blanked,
          hint: word.ex[lang] || word.ex.en || "",
          answer: word.w,
          options: shuffle([word.w, ...otherW])
        });
      }
    });
    return { questions: shuffle(qs).slice(0, Math.min(8, qs.length)), idx:0, score:0, answered:false, chosen:null };
  }

  function startQuiz(){
    const entry = getDayEntry(currentDay);
    quiz = buildQuiz(entry);
    if (!quiz) { renderQuizIntro(entry); return; }
    renderQuiz();
  }

  function renderQuiz(){
    const q = quiz.questions[quiz.idx];
    const label = q.type === "blank" ? tr().labelBlank : tr().labelMeaning;
    const hint = q.type === "blank" && q.hint ? `<div class="quiz-hint">${esc(q.hint)}</div>` : "";
    const opts = q.options.map((o,i) => {
      let cls = "opt";
      if (quiz.answered){
        if (o === q.answer) cls += " correct";
        else if (i === quiz.chosen) cls += " wrong";
        else cls += " dim";
      }
      return `<button class="${cls}" ${quiz.answered?"disabled":""} onclick="answerQuiz(${i})">${esc(o)}</button>`;
    }).join("");
    let footer = "";
    if (quiz.answered){
      const ok = q.options[quiz.chosen] === q.answer;
      const last = quiz.idx === quiz.questions.length - 1;
      footer = `<div class="quiz-footer">
        <div class="quiz-fb ${ok?"ok":"no"}">${ok?tr().correct:tr().wrong}</div>
        <button class="btn-primary quiz-next" onclick="nextQuiz()">${last?tr().finish:tr().next} →</button>
      </div>`;
    }
    const promptCls = q.type === "blank" ? "quiz-prompt blank-q" : "quiz-prompt";
    document.getElementById("quizArea").innerHTML = `
      <div class="quiz-card">
        <div class="quiz-head"><span>${quiz.idx+1} / ${quiz.questions.length}</span><span>${esc(tr().score)}: ${quiz.score}</span></div>
        <div class="quiz-label">${esc(label)}</div>
        <div class="${promptCls}">${q.prompt}</div>
        ${hint}
        <div class="quiz-options">${opts}</div>
        ${footer}
      </div>`;
  }

  function answerQuiz(i){
    if (quiz.answered) return;
    quiz.chosen = i;
    quiz.answered = true;
    const q = quiz.questions[quiz.idx];
    if (q.options[i] === q.answer) quiz.score++;
    renderQuiz();
  }

  function nextQuiz(){
    quiz.idx++; quiz.answered = false; quiz.chosen = null;
    if (quiz.idx >= quiz.questions.length) renderResult();
    else renderQuiz();
  }

  function renderResult(){
    const total = quiz.questions.length, sc = quiz.score, ratio = sc/total;
    const emo = ratio === 1 ? "Party%20popper/3D/party_popper_3d.png"
              : ratio >= 0.6 ? "Smiling%20face%20with%20smiling%20eyes/3D/smiling_face_with_smiling_eyes_3d.png"
              : "Brain/3D/brain_3d.png";
    const msg = lang === "ko" ? `${total}문제 중 ${sc}개 정답!` : `You scored ${sc} / ${total}`;
    document.getElementById("quizArea").innerHTML = `
      <div class="quiz-card quiz-result">
        <img class="result-emoji" src="${EMO}${emo}" alt="">
        <div class="result-msg">${esc(msg)}</div>
        <div class="result-actions">
          <button class="btn-primary" style="padding:13px 26px;border-radius:14px" onclick="startQuiz()">${esc(tr().retry)}</button>
          <button class="btn-ghost2" onclick="closeQuiz()">${esc(tr().close)}</button>
        </div>
      </div>`;
  }

  function closeQuiz(){ quiz = null; renderQuizIntro(getDayEntry(currentDay)); }

  /* Audio */
  let currentAudio = null, currentBtn = null;
  function resetBtn(btn){
    if (!btn) return;
    btn.classList.remove("playing");
    const txt = btn.querySelector(".txt"); if (txt) txt.textContent = tr().playAudio;
    const im = btn.querySelector(".btn-emoji"); if (im && im.dataset.play) im.src = im.dataset.play;
  }
  function toggleAudio(btn, src){
    if (currentAudio && currentBtn === btn && !currentAudio.paused) { currentAudio.pause(); return; }
    if (currentAudio) { currentAudio.pause(); resetBtn(currentBtn); }
    currentAudio = new Audio(src); currentBtn = btn;
    currentAudio.onplay = () => { btn.classList.add("playing"); const t=btn.querySelector(".txt"); if(t)t.textContent=tr().pause; const im=btn.querySelector(".btn-emoji"); if(im&&im.dataset.pause)im.src=im.dataset.pause; };
    currentAudio.onpause = () => resetBtn(btn);
    currentAudio.onended = () => resetBtn(btn);
    currentAudio.onerror = () => { resetBtn(btn); alert(tr().audioLoadErr); };
    currentAudio.play().catch(() => { resetBtn(btn); alert(tr().audioPlayErr); });
  }

  document.getElementById("langSwitch").addEventListener("click", e => {
    const b = e.target.closest(".lang-btn"); if (b) setLang(b.dataset.lang);
  });

  load();
  applyStatic();
  render();
</script>
</body>
</html>
